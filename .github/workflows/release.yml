name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build both platforms from."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      sha: ${{ steps.ref.outputs.sha }}
      version: ${{ steps.ref.outputs.version }}
      prerelease: ${{ steps.ref.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Resolve one existing tag for every platform
        id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$sha" = "$(git rev-parse HEAD)"
          version="${RELEASE_TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          printf 'tag=%s\nsha=%s\nversion=%s\nprerelease=%s\n' \
            "$RELEASE_TAG" "$sha" "$version" "$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: ${{ matrix.platform }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux]
        config: [Debug, Release]
        include:
          - platform: windows
            os: windows-2022
          - platform: linux
            os: ubuntu-24.04
    env:
      BUILD_CONFIG: ${{ matrix.config }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Set up MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Linux build prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libevdev-dev
      - name: Build and test Windows runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $config = $env:BUILD_CONFIG
          $build = "builds/Windows-$config"
          cmake -S . -B $build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=$config -DENABLE_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --config $config --target keyflow keyflow_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $build -C $config --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = "$build/$($config.ToLower())/bin/$config"
          if ((Get-FileHash src/config.json).Hash -ne (Get-FileHash "$folder/config.json").Hash) {
            throw "Bundled config differs from the source fixture"
          }
          foreach ($fixture in @("src/config.json", "designer/public/eduuh-dh-config.json")) {
            & "$folder/keyflow.exe" --validate (Resolve-Path $fixture).Path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and test Linux runtime and deployment tools
        if: matrix.platform == 'linux'
        run: |
          build="builds/Linux-$BUILD_CONFIG"
          cmake -S . -B "$build" -DCMAKE_BUILD_TYPE="$BUILD_CONFIG" -DENABLE_TESTS=ON -DENABLE_LINUX_DEVICE_TESTS=OFF
          cmake --build "$build" --target keyflow keyflow_tests --parallel 2
          ctest --test-dir "$build" --output-on-failure --no-tests=error
          folder="$build/${BUILD_CONFIG,,}/bin"
          cmp src/config.json "$folder/config.json"
          "$folder/keyflow" --validate src/config.json
          "$folder/keyflow" --validate designer/public/eduuh-dh-config.json
          python3 -B -m unittest discover -s tests/linux_service -v
          portable="builds/Portable-$BUILD_CONFIG"
          cmake -S . -B "$portable" -DCMAKE_BUILD_TYPE="$BUILD_CONFIG" -DENABLE_LINUX_BACKEND=OFF -DENABLE_TESTS=ON
          cmake --build "$portable" --target keyflow_tests --parallel 2
          ctest --test-dir "$portable" --output-on-failure --no-tests=error
      - name: Package KeyFlow Windows
        if: matrix.platform == 'windows' && matrix.config == 'Release'
        shell: pwsh
        run: |
          $folder = "builds/Windows-Release/release/bin/Release"
          foreach ($file in @("keyflow.exe", "interception.dll", "config.json")) {
            if (-not (Test-Path "$folder/$file" -PathType Leaf)) { throw "Missing $file" }
          }
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md, BUILD.md $folder
          New-Item -ItemType Directory -Force "$folder/docs" | Out-Null
          Copy-Item "docs/*" "$folder/docs/" -Recurse
          $env:SOURCE_COMMIT | Out-File -Encoding ASCII "$folder/SOURCE_COMMIT"
          # Retain the established Windows download filename.
          Compress-Archive -Path "$folder/*" -DestinationPath keyflow-release.zip
          $hash = (Get-FileHash -Algorithm SHA256 keyflow-release.zip).Hash.ToLower()
          "$hash  keyflow-release.zip" | Out-File -Encoding ASCII keyflow-release.zip.sha256
      - name: Package KeyFlow Linux (experimental)
        if: matrix.platform == 'linux' && matrix.config == 'Release'
        run: |
          stage=keyflow-linux-x86_64
          mkdir -p "$stage/scripts"
          install -m 0755 builds/Linux-Release/release/bin/keyflow "$stage/keyflow"
          install -m 0644 src/config.json "$stage/config.json"
          cp LICENSE README.md THIRD_PARTY_NOTICES.md BUILD.md "$stage/"
          cp -a docs "$stage/"
          cp -a scripts/linux "$stage/scripts/"
          printf '%s\n' "$SOURCE_COMMIT" > "$stage/SOURCE_COMMIT"
          printf 'Ubuntu 24.04 x86_64; system libevdev, glibc and libstdc++ required.\n' > "$stage/BUILD_INFO"
          test ! -e "$stage/interception.dll"
          "$stage/keyflow" --validate "$stage/config.json"
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - "$stage" | gzip -n > keyflow-linux-x86_64.tar.gz
          sha256sum keyflow-linux-x86_64.tar.gz > keyflow-linux-x86_64.tar.gz.sha256
      - name: Upload tested platform archive
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: keyflow-${{ matrix.platform }}-${{ needs.resolve.outputs.sha }}
          path: |
            keyflow-release.zip*
            keyflow-linux-x86_64.tar.gz*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: keyflow-*-${{ needs.resolve.outputs.sha }}
          merge-multiple: true
      - name: Verify both archives and their source commit
        run: |
          sha256sum -c keyflow-release.zip.sha256
          sha256sum -c keyflow-linux-x86_64.tar.gz.sha256
          test "$(unzip -p keyflow-release.zip SOURCE_COMMIT | tr -d '\r\n')" = "$SOURCE_COMMIT"
          test "$(tar -xOf keyflow-linux-x86_64.tar.gz keyflow-linux-x86_64/SOURCE_COMMIT | tr -d '\r\n')" = "$SOURCE_COMMIT"
      - name: Write Windows and Linux release description
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          changelog = Path("CHANGELOG.md").read_text()
          entry = None
          for version in (os.environ["RELEASE_VERSION"], "Unreleased"):
              entry = re.search(r"(?ms)^## \[" + re.escape(version) + r"\].*?(?=^## |\Z)", changelog)
              if entry:
                  break
          description = (
              "## Downloads\n\n"
              "- **KeyFlow Windows (x86_64):** `keyflow-release.zip` and its SHA256 checksum. "
              "Includes `keyflow.exe`, `interception.dll`, the config and documentation.\n"
              "- **KeyFlow Linux (experimental, Ubuntu 24.04 x86_64):** "
              "`keyflow-linux-x86_64.tar.gz` and its SHA256 checksum. "
              "Includes the binary, config, docs and opt-in systemd installation tools.\n\n"
              "Both archives come from `" + os.environ["SOURCE_COMMIT"] + "` and passed "
              "Windows/Linux Debug and Release build, test and fixture-validation gates.\n\n"
              "Linux needs system libevdev and compatible glibc/libstdc++. Extraction does not "
              "grant device access or start a remapper. Reboot, full desktop acceptance and "
              "manual Windows typing remain separate checks. Leave per-key verbose logging off.\n\n"
          )
          Path("release_notes.md").write_text(description + (entry.group() if entry else ""))
          PY
      - name: Publish both platforms once
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: KeyFlow Windows & KeyFlow Linux ${{ needs.resolve.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          make_latest: ${{ needs.resolve.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          files: |
            keyflow-release.zip
            keyflow-release.zip.sha256
            keyflow-linux-x86_64.tar.gz
            keyflow-linux-x86_64.tar.gz.sha256
          fail_on_unmatched_files: true
