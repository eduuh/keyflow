name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with CMake (Release + tests)
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON
          cmake --build build --config Release

      - name: Run tests
        shell: pwsh
        run: |
          cd build
          ctest -C Release --output-on-failure

      - name: Locate release folder
        id: locate
        shell: pwsh
        run: |
          # Visual Studio multi-config emits to slightly different paths depending
          # on CMake's OUTPUT_DIR resolution. Probe both common shapes.
          $possiblePaths = @(
            "build/release/bin/Release",
            "build/Release",
            "build/release/bin",
            "build/bin/Release"
          )
          $releaseFolder = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path (Join-Path $path "keyflow.exe")) {
              $releaseFolder = $path
              break
            }
          }
          if (-not $releaseFolder) {
            Write-Error "Release folder containing keyflow.exe not found"
            exit 1
          }
          Write-Host "Found release folder at: $releaseFolder"
          "release_folder=$releaseFolder" >> $env:GITHUB_OUTPUT

      - name: Stage release artifacts (binaries + LICENSE + README)
        shell: pwsh
        run: |
          $releaseFolder = "${{ steps.locate.outputs.release_folder }}"

          # Required bundled files. Fail fast if anything is missing.
          $requiredFiles = @("keyflow.exe", "interception.dll", "config.json")
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $releaseFolder $file))) {
              Write-Error "Required file missing: $file"
              exit 1
            }
          }

          # Include LICENSE + README so the zip is self-contained for users
          # who download and never visit the repo.
          Copy-Item "LICENSE" $releaseFolder
          Copy-Item "README.md" $releaseFolder

          $zipPath = "keyflow-release.zip"
          Compress-Archive -Path "$releaseFolder/*" -DestinationPath $zipPath
          Write-Host "Created $zipPath with contents:"
          Get-ChildItem $releaseFolder | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Compute SHA256 checksum
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 keyflow-release.zip).Hash.ToLower()
          "$hash  keyflow-release.zip" | Out-File -Encoding ASCII keyflow-release.zip.sha256
          Write-Host "SHA256: $hash"
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Extract CHANGELOG entry for this version
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # For a tag like v2.0.3, look for "## [2.0.3]" in CHANGELOG.md.
          # Fall back to [Unreleased] if no matching section exists yet.
          $version = "${{ github.ref_name }}".TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$version\].*?(?=\r?\n## |\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            Write-Host "No CHANGELOG entry for $version, falling back to [Unreleased]"
            $pattern = "(?s)## \[Unreleased\].*?(?=\r?\n## |\z)"
            $match = [regex]::Match($content, $pattern)
          }
          if ($match.Success) {
            $match.Value | Out-File -Encoding utf8 release_notes.md
          } else {
            "(no changelog entry found)" | Out-File -Encoding utf8 release_notes.md
          }
          Write-Host "release_notes.md contents:"
          Get-Content release_notes.md

      - name: Create Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KeyFlow ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            keyflow-release.zip
            keyflow-release.zip.sha256
          prerelease: false
          generate_release_notes: false
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Development Build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Development Build
          body: |
            Automated build from latest commit on main branch.

            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}
            **Message:** ${{ github.event.head_commit.message }}
            **SHA256:** `${{ steps.checksum.outputs.sha256 }}`

            ⚠️ This is a development build. For stable releases, see tagged versions.
          files: |
            keyflow-release.zip
            keyflow-release.zip.sha256
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
